# MySQL 8 一键启动（无本机 MySQL 时使用）
#
#   docker compose up -d
#   然后：
#   DB_BACKEND=mysql MYSQL_HOST=127.0.0.1 MYSQL_USER=root MYSQL_PASSWORD=studyroom \
#   MYSQL_DATABASE=campus_study_room python backend/server.py
#
# 首次启动会自动执行 database/mysql 下的建表与初始化脚本。

services:
  mysql:
    image: mysql:8.0
    container_name: studyroom-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: studyroom
      MYSQL_DATABASE: campus_study_room
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - ./database/mysql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/mysql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - studyroom-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pstudyroom"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  studyroom-mysql-data:
